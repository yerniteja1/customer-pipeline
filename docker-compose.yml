version: "3.9"

services:

  mock-server:
    build: ./mock-server
    container_name: customer_mock_server
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pipeline-service:
    build: ./pipeline-service
    container_name: customer_pipeline
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mock-server:
        condition: service_healthy