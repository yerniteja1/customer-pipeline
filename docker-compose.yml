version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: customer_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       customer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-server:
    build: ./mock-server
    container_name: customer_mock_server
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pipeline-service:
    build: ./pipeline-service
    container_name: customer_pipeline
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/customer_db
    depends_on:
      postgres:
        condition: service_healthy
      mock-server:
        condition: service_healthy

volumes:
  postgres_data: